name: Refresh Government of Canada travel advisories

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-travel-advisories
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and validate official advisory data
        run: python scripts/fetch_advisories.py

      - name: Fetch official regional map polygons
        run: python scripts/fetch_regional_advisories.py

      - name: Commit updated snapshots
        run: |
          if git diff --quiet -- data/travel-advisories.json data/regional-advisories.geojson; then
            echo "No advisory data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/travel-advisories.json data/regional-advisories.geojson
          git commit -m "Refresh Government of Canada travel advisories"
          git push
